<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Filtro de Accesorios Interactivo con Sobel</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: #000;
    font-family: sans-serif;
  }
  video, canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
  }
  .buttons {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    text-align: center;
  }
  .buttons button {
    margin: 4px;
    padding: 8px 12px;
    font-size: 14px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background-color: rgba(255,255,255,0.75);
  }
  .buttons button.active {
    background-color: rgba(0,180,0,0.8);
    color: white;
  }
</style>
</head>
<body>
<div class="buttons">
  <button id="sobelBtn" class="active">Filtro Sobel</button>
  <button id="hatBtn" class="active">Sombrero 🎩</button>
  <button onclick="nextHat()">Cambiar</button>
  <button id="glassesBtn" class="active">Lentes 🕶️</button>
  <button onclick="nextGlasses()">Cambiar</button>
  <button id="mustacheBtn" class="active">Bigote / Barba</button>
  <button onclick="nextMustache()">Cambiar</button>
  <button id="moleBtn" class="active">Lunar •</button>
</div>
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="filtro.js"></script>
</body>
</html>
